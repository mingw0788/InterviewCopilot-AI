openapi: 3.1.0
info:
  title: InterviewCopilot Internal AI API
  version: 1.0.0
  description: >-
    Versioned synchronous contract from the Java business service to the
    stateless Python AI capability service. This API is never exposed to the
    browser and never receives a user JWT.
servers:
  - url: /internal/v1
    description: Version 1 internal AI API
tags:
  - name: Questions
    description: Structured generation of one interview question.
  - name: Evaluations
    description: Structured evaluation of one immutable answer.
  - name: Reports
    description: Structured report-summary generation from Java metrics.
security:
  - serviceBearerAuth: []
paths:
  /questions/generate:
    post:
      tags: [Questions]
      summary: Generate one question
      description: >-
        Generates exactly one structured question. Java owns the question
        number, validates the result, and decides whether it may be persisted.
      operationId: generateQuestion
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionGenerationRequest'
      responses:
        '200':
          description: One validated question candidate returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionGenerationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/ProviderError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /evaluations/evaluate:
    post:
      tags: [Evaluations]
      summary: Evaluate one answer
      description: >-
        Returns four dimension scores and qualitative feedback. It never
        returns an answer overall score or any business-state decision.
      operationId: evaluateAnswer
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerEvaluationRequest'
      responses:
        '200':
          description: Structured evaluation candidate returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerEvaluationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/ProviderError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /reports/generate:
    post:
      tags: [Reports]
      summary: Generate a report summary
      description: >-
        Produces narrative fields from deterministic metrics supplied by Java.
        Python does not recalculate metrics or change report/session state.
      operationId: generateReport
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportGenerationRequest'
      responses:
        '200':
          description: Structured report narrative returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportGenerationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/ProviderError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
components:
  securitySchemes:
    serviceBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: ServiceToken
      description: Independent Java-to-Python service token, never a user JWT.
  parameters:
    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: true
      description: Identifier for this HTTP request.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    CorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: true
      description: Stable identifier across the complete business operation.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Stable business-operation key used for trace correlation and safe
        orchestration. Java and database constraints provide final idempotency.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[!-~]+$'
  responses:
    BadRequest:
      description: Request syntax or framing is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Internal service authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: The idempotency key conflicts with another payload or operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Input or structured output failed schema validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: The upstream provider rate limit was reached.
      headers:
        Retry-After:
          description: Seconds to wait before retrying when supplied by the provider.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected AI-service failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ProviderError:
      description: The LLM provider returned an unusable response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: The AI service or provider is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GatewayTimeout:
      description: The LLM operation exceeded its configured timeout.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Difficulty:
      type: string
      enum: [EASY, MEDIUM, HARD]
    QuestionType:
      type: string
      enum: [CONCEPTUAL, PRACTICAL, SCENARIO, DESIGN]
    Language:
      type: string
      enum: [zh-CN]
    Score:
      type: number
      minimum: 0
      maximum: 100
      multipleOf: 0.01
    ErrorCode:
      type: string
      enum:
        - INVALID_REQUEST
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - FORBIDDEN
        - RESOURCE_NOT_FOUND
        - ILLEGAL_INTERVIEW_STATE
        - INTERVIEW_NOT_READY
        - INTERVIEW_NOT_COMPLETED
        - DUPLICATE_SUBMISSION
        - IDEMPOTENCY_KEY_REUSED
        - OPERATION_IN_PROGRESS
        - REPORT_NOT_READY
        - AI_TIMEOUT
        - LLM_TIMEOUT
        - AI_SERVICE_UNAVAILABLE
        - LLM_PROVIDER_ERROR
        - RATE_LIMITED
        - INVALID_AI_RESPONSE
        - SCHEMA_VALIDATION_FAILED
        - NETWORK_ERROR
        - INTERNAL_ERROR
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, request_id, timestamp, details]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          minLength: 1
          maxLength: 500
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        timestamp:
          type: string
          format: date-time
        details:
          type: object
          additionalProperties: true
          description: Safe details only; provider stack traces and secrets are forbidden.
      example:
        code: LLM_TIMEOUT
        message: The language-model request timed out.
        request_id: req_01K6D6Y28N4C9M7Y5P3A2F8R1Q
        timestamp: '2026-10-04T12:00:45Z'
        details:
          capability: question_generation
          retryable: true
    TargetPosition:
      type: string
      minLength: 1
      maxLength: 100
      pattern: '^\S(?:.*\S)?$'
    Skills:
      type: array
      minItems: 1
      maxItems: 20
      uniqueItems: true
      items:
        type: string
        minLength: 1
        maxLength: 50
        pattern: '^\S(?:.*\S)?$'
    PreviousQuestion:
      type: object
      additionalProperties: false
      required: [question_number, question, topic, question_type]
      properties:
        question_number:
          type: integer
          minimum: 1
          maximum: 10
        question:
          type: string
          minLength: 1
          maxLength: 4000
        topic:
          type: string
          minLength: 1
          maxLength: 200
        question_type:
          $ref: '#/components/schemas/QuestionType'
    QuestionGenerationRequest:
      type: object
      additionalProperties: false
      required:
        - target_position
        - skills
        - difficulty
        - question_number
        - total_question_count
        - previous_questions
        - language
      properties:
        target_position:
          $ref: '#/components/schemas/TargetPosition'
        skills:
          $ref: '#/components/schemas/Skills'
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        question_number:
          type: integer
          minimum: 1
          maximum: 10
          description: Assigned by Java and not greater than total_question_count.
        total_question_count:
          type: integer
          minimum: 3
          maximum: 10
        previous_questions:
          type: array
          maxItems: 9
          items:
            $ref: '#/components/schemas/PreviousQuestion'
        language:
          $ref: '#/components/schemas/Language'
      example:
        target_position: Java Backend Engineer
        skills: [Java, Spring Boot, MySQL]
        difficulty: MEDIUM
        question_number: 2
        total_question_count: 5
        previous_questions:
          - question_number: 1
            question: 什么是事务隔离级别？
            topic: Transaction
            question_type: CONCEPTUAL
        language: zh-CN
    ExpectedPoints:
      type: array
      minItems: 1
      maxItems: 20
      uniqueItems: true
      items:
        type: string
        minLength: 1
        maxLength: 1000
    TokenUsage:
      type: object
      additionalProperties: false
      required: [input_tokens, output_tokens, total_tokens]
      properties:
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0
    QuestionMetadata:
      type: object
      additionalProperties: false
      required: [llm_provider, model_name, prompt_version, token_usage, latency_ms]
      properties:
        llm_provider:
          type: string
          minLength: 1
          maxLength: 100
        model_name:
          type: string
          minLength: 1
          maxLength: 200
        prompt_version:
          type: string
          enum: [question-v1]
        token_usage:
          $ref: '#/components/schemas/TokenUsage'
        latency_ms:
          type: integer
          minimum: 0
    QuestionGenerationResponse:
      type: object
      additionalProperties: false
      required: [question, topic, difficulty, expected_points, question_type, metadata]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 4000
        topic:
          type: string
          minLength: 1
          maxLength: 200
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        expected_points:
          $ref: '#/components/schemas/ExpectedPoints'
        question_type:
          $ref: '#/components/schemas/QuestionType'
        metadata:
          $ref: '#/components/schemas/QuestionMetadata'
      example:
        question: 请解释 Spring 事务传播行为的常见类型。
        topic: Spring Transaction
        difficulty: MEDIUM
        expected_points: [能够解释 REQUIRED 和 REQUIRES_NEW, 能够说明事务边界]
        question_type: CONCEPTUAL
        metadata:
          llm_provider: openai
          model_name: configured-model
          prompt_version: question-v1
          token_usage:
            input_tokens: 300
            output_tokens: 180
            total_tokens: 480
          latency_ms: 2300
    EvaluationQuestion:
      type: object
      additionalProperties: false
      required: [question, topic, difficulty, expected_points, question_type]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 4000
        topic:
          type: string
          minLength: 1
          maxLength: 200
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        expected_points:
          $ref: '#/components/schemas/ExpectedPoints'
        question_type:
          $ref: '#/components/schemas/QuestionType'
    ScoringRubric:
      type: object
      additionalProperties: false
      required: [accuracy, completeness, depth, clarity]
      properties:
        accuracy:
          type: string
          minLength: 1
          maxLength: 1000
        completeness:
          type: string
          minLength: 1
          maxLength: 1000
        depth:
          type: string
          minLength: 1
          maxLength: 1000
        clarity:
          type: string
          minLength: 1
          maxLength: 1000
    AnswerEvaluationRequest:
      type: object
      additionalProperties: false
      required:
        - target_position
        - skills
        - difficulty
        - question
        - candidate_answer
        - scoring_rubric
        - language
      properties:
        target_position:
          $ref: '#/components/schemas/TargetPosition'
        skills:
          $ref: '#/components/schemas/Skills'
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        question:
          $ref: '#/components/schemas/EvaluationQuestion'
        candidate_answer:
          type: string
          minLength: 1
          maxLength: 8000
          pattern: '^\s*\S[\s\S]*$'
          description: >-
            Untrusted user-controlled content. Prompt construction must delimit
            it and must never allow it to override system or task rules.
        scoring_rubric:
          $ref: '#/components/schemas/ScoringRubric'
        language:
          $ref: '#/components/schemas/Language'
      example:
        target_position: Java Backend Engineer
        skills: [Java, Spring Boot, MySQL]
        difficulty: MEDIUM
        question:
          question: 请解释 Spring 事务传播行为的常见类型。
          topic: Spring Transaction
          difficulty: MEDIUM
          expected_points: [能够解释 REQUIRED 和 REQUIRES_NEW, 能够说明事务边界]
          question_type: CONCEPTUAL
        candidate_answer: REQUIRED 会加入已有事务，REQUIRES_NEW 会挂起已有事务并创建新事务。
        scoring_rubric:
          accuracy: Evaluate technical correctness.
          completeness: Evaluate coverage of expected points.
          depth: Evaluate depth and boundary analysis.
          clarity: Evaluate structure and readability.
        language: zh-CN
    EvaluationMetadata:
      type: object
      additionalProperties: false
      required:
        - llm_provider
        - model_name
        - prompt_version
        - evaluation_version
        - token_usage
        - latency_ms
      properties:
        llm_provider:
          type: string
          minLength: 1
          maxLength: 100
        model_name:
          type: string
          minLength: 1
          maxLength: 200
        prompt_version:
          type: string
          enum: [evaluation-v1]
        evaluation_version:
          type: string
          minLength: 1
          maxLength: 100
        token_usage:
          $ref: '#/components/schemas/TokenUsage'
        latency_ms:
          type: integer
          minimum: 0
    AnswerEvaluationResponse:
      type: object
      additionalProperties: false
      required:
        - accuracy
        - completeness
        - depth
        - clarity
        - strengths
        - missing_points
        - feedback
        - metadata
      properties:
        accuracy:
          $ref: '#/components/schemas/Score'
        completeness:
          $ref: '#/components/schemas/Score'
        depth:
          $ref: '#/components/schemas/Score'
        clarity:
          $ref: '#/components/schemas/Score'
        strengths:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 1000
        missing_points:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 1000
        feedback:
          type: string
          minLength: 1
          maxLength: 4000
        metadata:
          $ref: '#/components/schemas/EvaluationMetadata'
      example:
        accuracy: 85.00
        completeness: 80.00
        depth: 78.00
        clarity: 88.00
        strengths: [掌握基本概念, 回答结构清晰]
        missing_points: [缺少异常场景分析]
        feedback: 建议补充不同传播行为在实际业务中的使用场景。
        metadata:
          llm_provider: openai
          model_name: configured-model
          prompt_version: evaluation-v1
          evaluation_version: rubric-v1
          token_usage:
            input_tokens: 700
            output_tokens: 300
            total_tokens: 1000
          latency_ms: 3500
    ReportMetrics:
      type: object
      additionalProperties: false
      required:
        - interview_overall_score
        - question_count
        - completed_question_count
        - average_accuracy
        - average_completeness
        - average_depth
        - average_clarity
        - duration_seconds
      properties:
        interview_overall_score:
          $ref: '#/components/schemas/Score'
        question_count:
          type: integer
          minimum: 3
          maximum: 10
        completed_question_count:
          type: integer
          minimum: 3
          maximum: 10
        average_accuracy:
          $ref: '#/components/schemas/Score'
        average_completeness:
          $ref: '#/components/schemas/Score'
        average_depth:
          $ref: '#/components/schemas/Score'
        average_clarity:
          $ref: '#/components/schemas/Score'
        duration_seconds:
          type: integer
          minimum: 0
    EvaluationSummary:
      type: object
      additionalProperties: false
      required:
        - question_number
        - answer_overall_score
        - strengths
        - missing_points
        - feedback
      properties:
        question_number:
          type: integer
          minimum: 1
          maximum: 10
        answer_overall_score:
          allOf:
            - $ref: '#/components/schemas/Score'
          description: Deterministic Java-calculated answer score.
        strengths:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 1000
        missing_points:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 1000
        feedback:
          type: string
          minLength: 1
          maxLength: 4000
    ReportGenerationRequest:
      type: object
      additionalProperties: false
      required:
        - target_position
        - skills
        - difficulty
        - metrics
        - evaluation_summaries
        - language
      properties:
        target_position:
          $ref: '#/components/schemas/TargetPosition'
        skills:
          $ref: '#/components/schemas/Skills'
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        metrics:
          $ref: '#/components/schemas/ReportMetrics'
        evaluation_summaries:
          type: array
          minItems: 3
          maxItems: 10
          items:
            $ref: '#/components/schemas/EvaluationSummary'
        language:
          $ref: '#/components/schemas/Language'
      example:
        target_position: Java Backend Engineer
        skills: [Java, Spring Boot, MySQL]
        difficulty: MEDIUM
        metrics:
          interview_overall_score: 82.50
          question_count: 3
          completed_question_count: 3
          average_accuracy: 84.20
          average_completeness: 79.80
          average_depth: 81.00
          average_clarity: 85.50
          duration_seconds: 900
        evaluation_summaries:
          - question_number: 1
            answer_overall_score: 82.55
            strengths: [掌握基本概念]
            missing_points: [缺少边界条件]
            feedback: 建议补充实际场景。
          - question_number: 2
            answer_overall_score: 80.25
            strengths: [表达清晰]
            missing_points: [缺少异常处理]
            feedback: 建议说明失败恢复。
          - question_number: 3
            answer_overall_score: 84.70
            strengths: [方案完整]
            missing_points: [缺少监控指标]
            feedback: 建议加入可观测性设计。
        language: zh-CN
    ReportMetadata:
      type: object
      additionalProperties: false
      required: [llm_provider, model_name, prompt_version, token_usage, latency_ms]
      properties:
        llm_provider:
          type: string
          minLength: 1
          maxLength: 100
        model_name:
          type: string
          minLength: 1
          maxLength: 200
        prompt_version:
          type: string
          enum: [report-v1]
        token_usage:
          $ref: '#/components/schemas/TokenUsage'
        latency_ms:
          type: integer
          minimum: 0
    ReportGenerationResponse:
      type: object
      additionalProperties: false
      required:
        - strength_summary
        - weakness_summary
        - improvement_suggestions
        - overall_comment
        - metadata
      properties:
        strength_summary:
          type: string
          minLength: 1
          maxLength: 4000
        weakness_summary:
          type: string
          minLength: 1
          maxLength: 4000
        improvement_suggestions:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 1000
        overall_comment:
          type: string
          minLength: 1
          maxLength: 4000
        metadata:
          $ref: '#/components/schemas/ReportMetadata'
      example:
        strength_summary: 候选人在基础概念和表达方面表现较好。
        weakness_summary: 对复杂边界条件的分析仍需加强。
        improvement_suggestions: [练习事务和并发场景, 补充系统设计回答框架]
        overall_comment: 整体具备继续深入后端开发的基础。
        metadata:
          llm_provider: openai
          model_name: configured-model
          prompt_version: report-v1
          token_usage:
            input_tokens: 1200
            output_tokens: 350
            total_tokens: 1550
          latency_ms: 4100
